name: CI Pipeline

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  push:
    branches:
      - master

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php_version: ["8.4", "8.5"]
    steps:
      - uses: actions/checkout@v5
      - name: Run tests
        run: make PHP_VERSION=${{ matrix.php_version }} test-ci
